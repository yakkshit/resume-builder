overview: >-
  This project provides a Model Context Protocol (MCP) server that allows AI assistants (Claude Desktop, Cursor,
  ChatGPT, Custom Agents) to list templates and generate Resume & Cover Letter PDFs. It supports both: 1. Stdio mode
  (local CLI / desktop clients) 2. Hosted HTTP JSON-RPC Endpoint (/api/mcp for cloud/remote agent hosting) ---
