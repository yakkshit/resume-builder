overview: >-
  README-INTERVIEW-LAB.md: This repo is a Next.js application that combines: - Resume Builder (build and export a
  resume) - Career Assistant Chat (multi-model chat with session-only API keys) - Cover Letter workflow - Interview Lab
  (mock interview rounds, coding tests, and live coaching) This document is the “one stop” guide for running the app,
  configuring Integrations, and understanding Interview Lab architecture. README-MCP.md: This project provides a Model
  Context Protocol (MCP) server that allows AI assistants (Claude Desktop, Cursor, ChatGPT, Custom Agents) to list
  templates and generate Resume & Cover Letter PDFs. It supports both: 1. Stdio mode (local CLI / desktop clients) 2.
  Hosted HTTP JSON-RPC Endpoint (/api/mcp for cloud/remote agent hosting) ---
